import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.guava:guava:32.1.3-jre'
    }
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

version = versionProps.getProperty('version')
ext.version_buildnumber = versionProps.getProperty('build_number')?.toInteger() ?: 0
ext.stage = versionProps.getProperty('stage') ?: ''

println "-> build.gradle applying version: $version (build ${version_buildnumber}) ${stage}"

group = 'mctmods.blastplaster'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(Jar).configureEach {
    zip64 true
}

ext {
    mod_id = gradleProps['mod_id']
    version_minecraft = versionProps['version_mc']
    version_neoforge = versionProps['version_neoforge']
    version_parchment = versionProps['version_parchment']
    mod_license = gradleProps['mod_license']
    mod_name = gradleProps['mod_name']
    mod_authors = gradleProps['mod_authors']
    mod_description = gradleProps['mod_description']
}

def version_replaces = {
    [
            'version'        : project.version,
            'build_number'   : version_buildnumber,
            'version_mc'     : version_minecraft,
            'version_neoforge' : version_neoforge,
            'mod_license'    : mod_license,
            'mod_name'       : mod_name,
            'mod_authors'    : mod_authors,
            'mod_description': mod_description,
            'stage'          : stage,
    ] as Map<String, Object>
}

def jsonPatterns = ["**/*.json", "**/*.mcmeta"]

processResources {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.properties(version_replaces())
    filesMatching("META-INF/neoforge.mods.toml") {
        expand version_replaces()
    }
    exclude ".cache"
    doLast {
        fileTree(dir: outputs.files.asPath, includes: jsonPatterns).each { File file ->
            file.text = JsonOutput.toJson(new JsonSlurper().parse(file, 'UTF-8'))
        }
    }
}

tasks.register('copyModsTomlForIntelliJ', Copy) {
    from processResources.destinationDir
    into "$projectDir/out/production/resources"
    include "META-INF/neoforge.mods.toml"
    dependsOn processResources
}

tasks.register('genIntellijRunsDummy') {
    group = 'ide'
    description = 'Dummy task for IntelliJ compatibility (satisfies genIntellijRunsDummy calls from IDE run configurations)'
    doLast {
        println 'genIntellijRunsDummy: dummy task executed successfully for IDE run configuration compatibility.'
    }
}

runs {
    configureEach {
        systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id}"
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
    }

    client {
    }

    server {
        arguments '--nogui'
    }
}

repositories {
    mavenCentral()

    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name 'ParchmentMC'
        url 'https://ldtteam.jfrog.io/artifactory/parchmentmc-public/'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${version_neoforge}"
    implementation "curse.maven:dynamictrees-252818:8228621"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('bumpVersion') {
    doLast {
        def props = new Properties()
        file('version.properties').withInputStream { props.load(it) }
        def currentBuild = props['build_number'].toInteger()
        def nextBuild = currentBuild + 1
        props['build_number'] = nextBuild.toString()
        file('version.properties').withOutputStream { props.store(it, null) }

        ext.version_buildnumber = nextBuild
        def stage = props['stage'] ?: ''
        def stagePart = stage ? "-${stage}" : ""
        def newVersion = "${props['version']}-b${nextBuild}${stagePart}"

        project.version = newVersion
        tasks.withType(Jar).configureEach {
            it.archiveVersion.set(newVersion)
        }
    }
}

build.dependsOn bumpVersion

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveBaseName.set("MCT-Blast-Plaster-${version_minecraft}")
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

artifacts {
    archives sourcesJar
}

jar {
    archiveBaseName.set("MCT-Blast-Plaster-${version_minecraft}")
    archiveClassifier.set('')
}